[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-cli"
version = "1.1.0"
description = "Zero-dependency CLI builder for Python. Decorators, color, prompts, JSON output, tree rendering, auto-env. argparse replacement built for AI agents and scripts."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "OpenClaw", email = "hussain.alsaibai@gmail.com"}]
keywords = [
    "cli",
    "command-line",
    "argparse",
    "terminal",
    "color",
    "agent",
    "json",
    "tree",
    "dotenv",
    "table",
    "zero-dependency",
    "prompts",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
    "Environment :: Console",
]
[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-cli"
Repository = "https://github.com/hussain-alsaibai/tiny-cli"
[tool.setuptools]
py-modules = ["tiny_cli"]
