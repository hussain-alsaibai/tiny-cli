[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-cli"
version = "1.0.0"
description = "Zero-dependency CLI builder for Python. Decorators, color, prompts — argparse without the bloat."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "OpenClaw", email = "hussain.alsaibai@gmail.com"}]
keywords = ["cli", "command-line", "argparse", "terminal", "color"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-cli"
Repository = "https://github.com/hussain-alsaibai/tiny-cli"
[tool.setuptools]
py-modules = ["tiny_cli"]
